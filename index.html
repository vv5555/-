
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中国近代史</title>
    <!-- 引入 SheetJS 用于解析 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* 变量定义 */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
            --warning: #f59e0b;
            --option-hover: #f9fafb;
            --option-selected: #eff6ff;
        }

        /* 深色模式变量 */
        [data-theme="dark"] {
            --bg: #111827;
            --card-bg: #1f2937;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #374151;
            --option-hover: #2d3748;
            --option-selected: #1e3a8a;
            --success: #059669;
            --error: #dc2626;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: background-color 0.3s;
        }

        .hidden { display: none !important; }

        /* 夜览模式切换按钮 */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* 导入界面 */
        .upload-area {
            border: 2px dashed var(--border);
            padding: 40px 20px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        .upload-area:hover { border-color: var(--primary); }

        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 25px; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-warning { background: var(--warning); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 练习界面 */
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        #progressFill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        .q-info { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-sub); margin-bottom: 12px; }
        .q-type { background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        [data-theme="dark"] .q-type { background: #1e3a8a; color: #dbeafe; }

        .q-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 25px; font-weight: 600; }

        .options-list { display: grid; gap: 12px; }

        .option-item {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: flex-start;
            background: var(--card-bg);
        }

        .option-item:active { background: var(--option-hover); }
        .option-item.selected { border-color: var(--primary); background: var(--option-selected); }
        .option-item.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .option-item.wrong { background: var(--error) !important; color: white; border-color: var(--error); }

        .feedback-box { margin-top: 25px; padding: 18px; border-radius: 12px; display: none; }

        .nav-controls { display: flex; gap: 12px; margin-top: 25px; }
        .nav-controls button { flex: 1; margin: 0; }

        .stats-info { text-align: center; margin: 20px 0; color: var(--text-sub); font-size: 0.95rem; }
        .wrong-count-tag { background: #fee2e2; color: #ef4444; padding: 2px 8px; border-radius: 6px; margin-left: 5px; font-size: 0.85rem; }
        [data-theme="dark"] .wrong-count-tag { background: #451a1a; color: #f87171; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <!-- 夜览模式切换 -->
    <div class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
        🌙
    </div>

    <!-- 设置界面 -->
    <div id="setupView">
        <h1>三星题库练习系统</h1>
        
        <div id="importSection">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" class="hidden" accept=".xlsx, .xls">
                <div style="font-size: 3rem; margin-bottom: 10px;">📄</div>
                <p id="fileStatus">点击上传 Excel 题库文件</p>
                <small style="color: var(--text-sub)">题号、题型、内容、选项A-E、正确答案</small>
            </div>
        </div>

        <div id="actionButtons" class="hidden">
            <div class="stats-info" id="bankInfo"></div>
            <button class="btn btn-primary" onclick="initQuiz('random', 30)">⚡ 随机抽取 30 题</button>
            <button class="btn btn-outline" onclick="initQuiz('all')">📖 全题库顺序练习</button>
            <button id="wrongPracticeBtn" class="btn btn-warning" onclick="initQuiz('wrong')">
                🔥 错题本练习 <span id="wrongCountLabel" class="wrong-count-tag">0</span>
            </button>
            
            <div style="margin-top: 40px; text-align: center;">
                <button onclick="clearSystem()" style="color: var(--text-sub); border:none; background:none; cursor:pointer; font-size: 0.85rem; text-decoration: underline;">重置所有数据</button>
            </div>
        </div>
    </div>

    <!-- 练习界面 -->
    <div id="quizView" class="hidden">
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div class="q-info">
            <span id="qIdx">第 1 题</span>
            <span id="quizModeLabel" style="color:var(--warning); font-weight:bold;">模式</span>
            <span id="qType" class="q-type">单选题</span>
        </div>
        <div id="questionText" class="q-text"></div>
        <div id="optionsContainer" class="options-list"></div>

        <div id="feedbackBox" class="feedback-box">
            <strong id="resultTag">结果</strong>
            <p id="correctAnswerText" style="margin: 8px 0 0 0;"></p>
        </div>

        <div class="nav-controls">
            <button class="btn btn-outline" id="prevBtn" onclick="changeQuestion(-1)">上一题</button>
            <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">提交</button>
            <button class="btn btn-outline" id="nextBtn" onclick="changeQuestion(1)">下一题</button>
        </div>
        
        <button class="btn btn-ghost" style="margin-top:25px; color: var(--text-sub); font-size: 0.9rem; border:none; background:none; width:100%; text-align:center; cursor:pointer;" onclick="exitQuiz()">返回主页</button>
    </div>
</div>

<script>
    let questionBank = [];
    let wrongBank = [];
    let quizList = [];
    let currentIndex = 0;
    let userAnswers = {};
    let currentMode = 'all';

    window.onload = () => {
        // 加载主题
        const savedTheme = localStorage.getItem('safety_theme') || 'light';
        setTheme(savedTheme);
        loadData();
    };

    // 主题切换逻辑
    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const target = current === 'light' ? 'dark' : 'light';
        setTheme(target);
    }

    function setTheme(theme) {
        document.body.setAttribute('data-theme', theme);
        document.getElementById('themeBtn').innerText = theme === 'light' ? '🌙' : '☀️';
        localStorage.setItem('safety_theme', theme);
    }

    function loadData() {
        const b = localStorage.getItem('safety_bank_v2');
        if (b) questionBank = JSON.parse(b);
        const w = localStorage.getItem('safety_wrong_v2');
        if (w) wrongBank = JSON.parse(w);

        if (questionBank.length > 0) showReady();
        updateWrongLabel();
    }

    function updateWrongLabel() {
        const label = document.getElementById('wrongCountLabel');
        const btn = document.getElementById('wrongPracticeBtn');
        label.innerText = wrongBank.length;
        btn.disabled = wrongBank.length === 0;
    }

    document.getElementById('fileInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                questionBank = json.map((row, idx) => {
                    const opts = [];
                    ['A','B','C','D','E'].forEach(l => {
                        if(row[`选项${l}`]) opts.push({ id: l, text: row[`选项${l}`] });
                    });
                    const uid = btoa(unescape(encodeURIComponent(row['题目内容'] + (row['选项A'] || "")))).substring(0, 16);
                    return {
                        uid, id: row['题号'] || (idx + 1),
                        type: row['题型'] || "单选题",
                        content: row['题目内容'],
                        options: opts,
                        answer: String(row['正确答案']).toUpperCase().replace(/[^A-E]/g, ''),
                        isMulti: String(row['正确答案']).length > 1
                    };
                }).filter(q => q.content && q.answer);

                if (questionBank.length > 0) {
                    localStorage.setItem('safety_bank_v2', JSON.stringify(questionBank));
                    showReady();
                    alert("导入成功！");
                }
            } catch (err) { alert("导入失败，请检查文件"); }
        };
        reader.readAsArrayBuffer(file);
    };

    function showReady() {
        document.getElementById('actionButtons').classList.remove('hidden');
        document.getElementById('bankInfo').innerText = `已成功加载：${questionBank.length} 道题目`;
        updateWrongLabel();
    }

    function initQuiz(mode, count) {
        currentIndex = 0;
        userAnswers = {};
        currentMode = mode;
        const labels = {'random': '⚡ 随机抽取', 'all': '📖 顺序练习', 'wrong': '🔥 错题强化'};
        document.getElementById('quizModeLabel').innerText = labels[mode];

        if (mode === 'random') {
            quizList = [...questionBank].sort(() => Math.random() - 0.5).slice(0, count);
        } else if (mode === 'wrong') {
            quizList = [...wrongBank].sort(() => Math.random() - 0.5);
        } else {
            quizList = [...questionBank];
        }

        document.getElementById('setupView').classList.add('hidden');
        document.getElementById('quizView').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = quizList[currentIndex];
        const state = userAnswers[currentIndex] || { selected: [], isSubmitted: false };
        
        document.getElementById('qIdx').innerText = `第 ${currentIndex + 1} / ${quizList.length} 题`;
        document.getElementById('qType').innerText = q.isMulti ? "多选题" : "单选题";
        document.getElementById('progressFill').style.width = `${((currentIndex + 1) / quizList.length) * 100}%`;
        document.getElementById('questionText').innerText = q.content;

        const container = document.getElementById('optionsContainer');
        container.innerHTML = "";
        q.options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'option-item' + (state.selected.includes(opt.id) ? ' selected' : '');
            if (state.isSubmitted) {
                if (q.answer.includes(opt.id)) div.classList.add('correct');
                else if (state.selected.includes(opt.id)) div.classList.add('wrong');
            }
            div.innerHTML = `<b style="margin-right:12px">${opt.id}.</b> ${opt.text}`;
            div.onclick = () => selectOption(opt.id);
            container.appendChild(div);
        });

        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === quizList.length - 1;
        
        const subBtn = document.getElementById('submitBtn');
        if (state.isSubmitted) {
            subBtn.disabled = true; subBtn.innerText = "已提交";
            showFeedback(q, state);
        } else {
            subBtn.disabled = false; subBtn.innerText = "提交";
            document.getElementById('feedbackBox').style.display = 'none';
        }
    }

    function selectOption(id) {
        if (userAnswers[currentIndex]?.isSubmitted) return;
        if (!userAnswers[currentIndex]) userAnswers[currentIndex] = { selected: [], isSubmitted: false };
        const q = quizList[currentIndex];
        let sel = userAnswers[currentIndex].selected;
        if (q.isMulti) {
            userAnswers[currentIndex].selected = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id];
        } else {
            userAnswers[currentIndex].selected = [id];
        }
        renderQuestion();
    }

    function submitAnswer() {
        const state = userAnswers[currentIndex];
        if (!state || state.selected.length === 0) return;
        state.isSubmitted = true;
        const q = quizList[currentIndex];
        const userStr = state.selected.sort().join('');
        const correctStr = q.answer.split('').sort().join('');
        const isRight = userStr === correctStr;

        if (!isRight) {
            if (!wrongBank.some(item => item.uid === q.uid)) {
                wrongBank.push(q);
                localStorage.setItem('safety_wrong_v2', JSON.stringify(wrongBank));
            }
        } else if (currentMode === 'wrong') {
            wrongBank = wrongBank.filter(item => item.uid !== q.uid);
            localStorage.setItem('safety_wrong_v2', JSON.stringify(wrongBank));
        }
        renderQuestion();
    }

    function showFeedback(q, state) {
        const box = document.getElementById('feedbackBox');
        const userStr = state.selected.sort().join('');
        const correctStr = q.answer.split('').sort().join('');
        const isRight = userStr === correctStr;

        box.style.display = 'block';
        box.style.background = isRight ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
        const tag = document.getElementById('resultTag');
        tag.innerText = isRight ? "✅ 回答正确" : "❌ 回答错误";
        tag.style.color = isRight ? "#10b981" : "#ef4444";
        document.getElementById('correctAnswerText').innerText = isRight ? "" : `正确答案是：${q.answer}`;
    }

    function changeQuestion(step) { currentIndex += step; renderQuestion(); }
    
    function exitQuiz() {
        if (confirm("返回主页？")) {
            document.getElementById('setupView').classList.remove('hidden');
            document.getElementById('quizView').classList.add('hidden');
            updateWrongLabel();
        }
    }

    function clearSystem() {
        if (confirm("确定要清空题库和错题本吗？")) {
            localStorage.clear();
            location.reload();
        }
    }
</script>
</body>
</html>
