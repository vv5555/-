<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马原练习系统专用版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #4A90E2; --bg: #f8f9fa; --success: #27ae60; --error: #e74c3c; --selected: #e1f0ff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: 10px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .opt-item { padding: 15px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; margin-top:10px; transition: 0.2s; background: #fff; display: flex; align-items: flex-start; }
        .opt-item.selected { background: var(--selected); border-color: var(--primary); }
        .opt-item.correct { background: var(--success) !important; color: white; }
        .opt-item.wrong { background: var(--error) !important; color: white; }
        .nav-btn { flex: 1; padding: 12px; border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .dash-btn { padding: 15px; background: #673ab7; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div id="setupUI">
        <h2 style="text-align:center">📚 导入《马原》题库</h2>
        <div style="border: 2px dashed #ccc; padding: 30px; text-align: center; border-radius: 10px;">
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <p id="tip" style="color:#666;">请选择你的 Excel 文件</p>
        </div>
        <div id="readyActions" class="hidden" style="margin-top:20px;">
            <button class="dash-btn" onclick="startDash(30)">⚡ 随机抽 30 题 (适合模拟考)</button>
            <button class="nav-btn" style="width:100%; margin-top:10px;" onclick="startNormal()">全部 192 题练习</button>
        </div>
    </div>

    <div id="quizUI" class="hidden">
        <div id="progressText" style="font-weight:bold; color:var(--primary); text-align:center; margin-bottom:10px;"></div>
        <div id="qText" style="font-size:1.1rem; font-weight:bold; margin-bottom:20px;"></div>
        <div id="optList"></div>
        <div id="ansShow" style="margin-top:15px; padding:10px; border-radius:5px; background:#f0f7f0; display:none;">
            <b>答案：</b> <span id="feedbackText"></span>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="nav-btn" id="prevBtn" onclick="changeQ(-1)">上一题</button>
            <button class="nav-btn" id="mainBtn" style="background:var(--primary); color:white;" onclick="handleSubmit()">提交答案</button>
            <button class="nav-btn" id="nextBtn" onclick="changeQ(1)">下一题</button>
        </div>
        <p style="text-align:center; font-size:0.8rem; margin-top:20px; color:red; cursor:pointer;" onclick="localStorage.clear();location.reload();">清空并重新导入</p>
    </div>
</div>

<script>
    let fullBank = []; let currentQuiz = []; let cur = 0; let userAnswers = {};

    window.onload = function() {
        const saved = localStorage.getItem('mayuan_db');
        if (saved) { fullBank = JSON.parse(saved); document.getElementById('readyActions').classList.remove('hidden'); document.getElementById('tip').innerText="题库已就绪"; }
    };

    document.getElementById('excelFile').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const data = new Uint8Array(ev.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                
                // 针对你的马原文件列顺序：A题号, B题型, C题目, D-G选项, H答案
                fullBank = json.slice(1).map(row => {
                    let ans = String(row[7] || "").toUpperCase().trim(); // 正确答案在第8列(索引7)
                    return {
                        q: row[2], // 题目在第3列
                        opts: [
                            {id:'A', t:row[3]}, {id:'B', t:row[4]},
                            {id:'C', t:row[5]}, {id:'D', t:row[6]}
                        ].filter(o => o.t),
                        ans: ans,
                        isMulti: ans.length > 1
                    };
                }).filter(r => r.q && r.ans);

                if(fullBank.length === 0) throw "解析失败，请检查文件列顺序";
                localStorage.setItem('mayuan_db', JSON.stringify(fullBank));
                location.reload();
            } catch(err) { alert("错误: " + err); }
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    };

    function startDash(n) {
        currentQuiz = [];
        for(let i=0; i<n; i++) {
            let item = JSON.parse(JSON.stringify(fullBank[Math.floor(Math.random()*fullBank.length)]));
            item.displayOpts = item.opts.sort(()=>Math.random()-0.5);
            currentQuiz.push(item);
        }
        enter();
    }

    function startNormal() {
        currentQuiz = fullBank.map(i => {
            let t = JSON.parse(JSON.stringify(i));
            t.displayOpts = t.opts.sort(()=>Math.random()-0.5);
            return t;
        }).sort(()=>Math.random()-0.5);
        enter();
    }

    function enter() {
        document.getElementById('setupUI').classList.add('hidden');
        document.getElementById('quizUI').classList.remove('hidden');
        render();
    }

    function render() {
        const item = currentQuiz[cur];
        const state = userAnswers[cur] || { sel: [], sub: false };
        document.getElementById('progressText').innerText = `第 ${cur + 1} / ${currentQuiz.length} 题 (${item.isMulti?'多选':'单选'})`;
        document.getElementById('qText').innerText = item.q;
        const list = document.getElementById('optList'); list.innerHTML = "";
        
        item.displayOpts.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'opt-item' + (state.sel.includes(opt.id) ? ' selected' : '');
            if(state.sub) {
                if(item.ans.includes(opt.id)) btn.classList.add('correct');
                else if(state.sel.includes(opt.id)) btn.classList.add('wrong');
            }
            btn.innerHTML = `<b style="margin-right:10px">${String.fromCharCode(65+idx)}.</b> ${opt.t}`;
            btn.onclick = () => { if(!state.sub) toggle(opt.id); };
            list.appendChild(btn);
        });

        document.getElementById('prevBtn').disabled = cur === 0;
        document.getElementById('nextBtn').disabled = cur === currentQuiz.length - 1;
        const mb = document.getElementById('mainBtn');
        const as = document.getElementById('ansShow');
        if(state.sub) {
            mb.innerText = "已提交"; mb.disabled = true;
            as.style.display = 'block';
            let isR = item.ans.split('').sort().join('') === state.sel.sort().join('');
            document.getElementById('feedbackText').innerHTML = isR ? "<span style='color:green'>正确</span>" : `<span style='color:red'>错误，答案是 ${item.ans}</span>`;
        } else {
            mb.innerText = "提交答案"; mb.disabled = false; as.style.display = 'none';
        }
    }

    function toggle(id) {
        if(!userAnswers[cur]) userAnswers[cur] = { sel: [], sub: false };
        if(currentQuiz[cur].isMulti) {
            let s = userAnswers[cur].sel;
            userAnswers[cur].sel = s.includes(id) ? s.filter(x=>x!==id) : [...s, id];
        } else { userAnswers[cur].sel = [id]; }
        render();
    }

    function handleSubmit() {
        if(!userAnswers[cur] || userAnswers[cur].sel.length === 0) return;
        userAnswers[cur].sub = true; render();
    }

    function changeQ(d) { cur += d; render(); }
</script>
</body>
</html>
